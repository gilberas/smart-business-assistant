services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        container_name: ba-app
        ports:
            - '8000:8000'
        volumes:
            - .:/var/www/html
            - ./storage:/var/www/html/storage
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=business_assistant
            - DB_USERNAME=ba_user
            - DB_PASSWORD=ba_password
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - QUEUE_CONNECTION=redis
            - CACHE_STORE=redis
            - SESSION_DRIVER=redis
            - MAIL_MAILER=smtp
            - MAIL_HOST=mailpit
            - MAIL_PORT=1025
            - MAIL_FROM_ADDRESS=noreply@example.com
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - ba-network

    queue:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        container_name: ba-queue
        command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3', '--max-time=3600']
        volumes:
            - .:/var/www/html
        environment:
            - APP_ENV=local
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=business_assistant
            - DB_USERNAME=ba_user
            - DB_PASSWORD=ba_password
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - QUEUE_CONNECTION=redis
            - CACHE_STORE=redis
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - ba-network

    horizon:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        container_name: ba-horizon
        command: ['php', 'artisan', 'horizon']
        volumes:
            - .:/var/www/html
        environment:
            - APP_ENV=local
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=business_assistant
            - DB_USERNAME=ba_user
            - DB_PASSWORD=ba_password
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - QUEUE_CONNECTION=redis
            - CACHE_STORE=redis
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - ba-network

    nginx:
        image: nginx:alpine
        container_name: ba-nginx
        ports:
            - '80:80'
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - ba-network

    mysql:
        image: mysql:8.4
        container_name: ba-mysql
        ports:
            - '3306:3306'
        environment:
            MYSQL_DATABASE: business_assistant
            MYSQL_USER: ba_user
            MYSQL_PASSWORD: ba_password
            MYSQL_ROOT_PASSWORD: root_password
        volumes:
            - ba-mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            timeout: 5s
            retries: 10
        networks:
            - ba-network

    redis:
        image: redis:7-alpine
        container_name: ba-redis
        ports:
            - '6379:6379'
        volumes:
            - ba-redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            timeout: 5s
            retries: 10
        networks:
            - ba-network

    mailpit:
        image: axllent/mailpit:latest
        container_name: ba-mailpit
        ports:
            - '1025:1025'
            - '8025:8025'
        networks:
            - ba-network

    node:
        image: node:22-alpine
        container_name: ba-node
        working_dir: /var/www/html
        command: ['npm', 'run', 'dev']
        ports:
            - '5173:5173'
        volumes:
            - .:/var/www/html
        environment:
            - CHOKIDAR_USEPOLLING=1
        networks:
            - ba-network

volumes:
    ba-mysql-data:
    ba-redis-data:

networks:
    ba-network:
        driver: bridge
